# Test, build and release PDF Studio for Windows and macOS.
#
# Every push to main, pull request and manual run: test on each platform,
# build the apps, run the bundles' self-tests and attach the downloads
# (Windows zip, macOS disk images) to the run.
#
# On main, when src/pdf_studio/__init__.py has a version that isn't released
# yet: also sign the Windows app (Azure Artifact Signing) and sign and
# notarize the macOS apps (Apple Developer ID), each once its secrets are set
# up (see docs/RELEASING.md), and publish GitHub release v<version> with every
# download, using that version's CHANGELOG.md section as notes. Pushes that
# keep the version only build, so nothing is released twice.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this a new release?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pdf_studio/__init__.py)
          release=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]] \
              && ! gh release view "v$version" > /dev/null 2>&1; then
            python3 scripts/release_notes.py --check "$version"
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, new release: $release"

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write  # Azure sign-in for code signing (OpenID Connect, no stored password)
    env:
      SIGN: ${{ needs.version.outputs.release == 'true' && vars.AZURE_SIGNING_ENDPOINT != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build the app and run its self-test
        shell: pwsh
        run: .\scripts\build_pdf_studio.ps1 -Smoke

      - name: Sign in to Azure
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign PDFStudio.exe
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\PDFStudio\PDFStudio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: PDF Studio
          # sign in with the Azure CLI session from the step above only
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Check the signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\PDFStudio\PDFStudio.exe
          Write-Host "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      - name: Zip
        shell: pwsh
        run: .\scripts\build_pdf_studio.ps1 -SkipBuild -Zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/PDFStudio-win64.zip
          retention-days: 30

  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SIGN: ${{ needs.version.outputs.release == 'true' && secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Load the Developer ID certificate and the notary key
        if: env.SIGN == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 has no Developer ID Application certificate with its key"
            exit 1
          fi
          echo "Signing as: $identity"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary_key.p8"
          {
            echo "PDF_STUDIO_SIGN_IDENTITY=$identity"
            echo "PDF_STUDIO_NOTARY_KEY=$RUNNER_TEMP/notary_key.p8"
            echo "PDF_STUDIO_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "PDF_STUDIO_NOTARY_ISSUER=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build the app, run its self-test, make the disk image
        run: bash scripts/build_pdf_studio_macos.sh --smoke ${{ env.SIGN == 'true' && '--notarize' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/PDFStudio-macos-${{ matrix.arch }}.dmg
          retention-days: 30

      - name: Remove the signing keychain and key
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary_key.p8"

  release:
    name: Publish release
    needs: [version, windows, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and its tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          MAC_NOTARIZED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        run: |
          ls -l assets
          flags=()
          if [ "$MAC_NOTARIZED" = "true" ]; then flags+=(--mac-notarized); fi
          python3 scripts/release_notes.py "${flags[@]}" "$VERSION" assets/* > notes.md
          gh release create "v$VERSION" assets/* \
            --title "PDF Studio $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          echo "Published v$VERSION"
